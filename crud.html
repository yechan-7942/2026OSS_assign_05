<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식품 관리 프로그램</title>


    <script>
        let foods = [
            { id: 1, product: "새우깡", count: 10, price: 1500, day: "2026-12-31", category: "과자" },
            { id: 2, product: "메로나", count: 8, price: 1000, day: "2027-03-01", category: "아이스크림" },
            { id: 3, product: "콜라", count: 4, price: 2000, day: "2027-06-30", category: "음료" }
        ];

        let nextId = 4;


        function render() {
            let list = document.getElementById("List");
            list.innerHTML = "";

            for (let i = 0; i < foods.length; i++) {
                let food = foods[i];
                let tr = document.createElement("tr");

                let tdId = document.createElement("td");
                tdId.innerText = food.id;
                tr.appendChild(tdId);

                let tdProduct = document.createElement("td");
                tdProduct.innerText = food.product;
                tr.appendChild(tdProduct);

                let tdCount = document.createElement("td");
                tdCount.innerText = food.count;
                tr.appendChild(tdCount);

                let tdPrice = document.createElement("td");
                tdPrice.innerText = food.price;
                tr.appendChild(tdPrice);

                let tdDay = document.createElement("td");
                tdDay.innerText = food.day;
                tr.appendChild(tdDay);

                let tdCategory = document.createElement("td");
                tdCategory.innerText = food.category;
                tr.appendChild(tdCategory);

                let tdButton = document.createElement("td");

                let editBtn = document.createElement("button");
                editBtn.innerText = "수정";
                editBtn.className = "edit_btn";
                editBtn.addEventListener("click", function () {
                    editProduct(i);
                });

                let deleteBtn = document.createElement("button");
                deleteBtn.innerText = "삭제";
                deleteBtn.className = "delete_btn";
                deleteBtn.addEventListener("click", function () {
                    deleteProduct(i);
                });



                tdButton.appendChild(editBtn);
                tr.appendChild(tdButton);
                tdButton.appendChild(deleteBtn);


                list.appendChild(tr);
            }
        }


        function editProduct(index) {
            let food = foods[index];
            document.getElementById("product").value = food.product;
            document.getElementById("count").value = food.count;
            document.getElementById("price").value = food.price;
            document.getElementById("day").value = food.day;
            document.getElementById("category").value = food.category;
        }


        function deleteProduct(index) {
            if (confirm("삭제하시겠습니까?")) {
                foods.splice(index, 1);
                render();
            }
        }




        window.onload = function () {
            render();
        };


    </script>
</head>







<body>
    <div class="container"></div>
    <h1> 식품 관리</h1>

    <div class="row">
        <label for="title"> 상품 이름: </label>
        <input type="text" id="product" required placeholder="상품을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="count">상품 수량:</label>
        <input type="text" id="count" required placeholder="상품의 수량을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="price">상품 가격:</label>
        <input type="text" id="price" required placeholder="상품의 가격을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="day">유통기한:</label>
        <input type="text" id="day" required placeholder="상품의 유통기한을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="category">카테고리:</label>
        <select id="category" required>
            <option value=""> -- 선택 --</option>
            <option value="과자">과자</option>
            <option value="아이스크림">아이스크림</option>
            <option value="음료">음료</option>
            <option value="과일"> 과일</option>


        </select>
    </div>

    <div>
        <button id="addBtn"> 저장</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>수량</th>
                <th>가격</th>
                <th>유통기한</th>
                <th>카테고리</th>

            </tr>
        </thead>
        <tbody id="List"></tbody>
    </table>

    </div>
</body>

</html>
