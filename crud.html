<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식품 관리 프로그램</title>
</head>



<body>
    <div class="container"></div>
    <h1> 식품 관리</h1>

    <div class="row">
        <label for="title"> 상품 이름: </label>
        <input type="text" id="product" required placeholder="상품을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="count">상품 수량:</label>
        <input type="text" id="count" required placeholder="상품의 수량을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="price">상품 가격:</label>
        <input type="text" id="price" required placeholder="상품의 가격을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="day">유통기한:</label>
        <input type="text" id="day" required placeholder="상품의 유통기한을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="category">카테고리:</label>
        <input type="text" id="category" required placeholder="상품의 카테고리를 입력하시오">
    </div>
    </div>
</body>

</html>
