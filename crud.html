<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식품 관리 프로그램</title>


    <script>
        let foods = [
            { id: 1, product: "새우깡", count: 10, price: 1500, day: "2026-12-31", category: "과자" },
            { id: 2, product: "메로나", count: 8, price: 1000, day: "2027-03-01", category: "아이스크림" },
            { id: 3, product: "콜라", count: 4, price: 2000, day: "2027-06-30", category: "음료" }
        ];

        
    </script>
</head>







<body>
    <div class="container"></div>
    <h1> 식품 관리</h1>

    <div class="row">
        <label for="title"> 상품 이름: </label>
        <input type="text" id="product" required placeholder="상품을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="count">상품 수량:</label>
        <input type="text" id="count" required placeholder="상품의 수량을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="price">상품 가격:</label>
        <input type="text" id="price" required placeholder="상품의 가격을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="day">유통기한:</label>
        <input type="text" id="day" required placeholder="상품의 유통기한을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="category">카테고리:</label>
        <select id="category" required>
            <option value=""> -- 선택 --</option>
            <option value="과자">과자</option>
            <option value="아이스크림">아이스크림</option>
            <option value="음료">음료</option>
            <option value="과일"> 과일</option>


        </select>
    </div>

    <div>
        <button id="addBtn"> 저장</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>수량</th>
                <th>가격</th>
                <th>유통기한</th>
                <th>카테고리</th>

            </tr>
        </thead>
        <tbody id="List"></tbody>
    </table>

    </div>
</body>

</html>
