<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식품 관리 프로그램</title>
</head>



<body>
    <div class="container"></div>
    <h1> 식품 관리</h1>

    <div class="row">
        <label for="title"> 상품 이름: </label>
        <input type="text" id="product" required placeholder="상품을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="count">상품 수량:</label>
        <input type="text" id="count" required placeholder="상품의 수량을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="price">상품 가격:</label>
        <input type="text" id="price" required placeholder="상품의 가격을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="day">유통기한:</label>
        <input type="text" id="day" required placeholder="상품의 유통기한을 입력하시오">
    </div>

    <p> </p>
    <div class="row">
        <label for="category">카테고리:</label>
        <select id="category" required>
            <option value=""> -- 선택 --</option>
            <option value="">과자</option>
            <option value="">아이스크림</option>
            <option value="">음료</option>
            <option value=""> 과일</option>


        </select>
    </div>

    <div>
        <button id="addBtn"> 저장</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>이름</th>
                <th>수량</th>
                <th>가격</th>
                <th>유통기한</th>
                <th>카테고리</th>

            </tr>
        </thead>
        <tbody id="List"></tbody>
    </table>

    </div>
</body>

</html>
