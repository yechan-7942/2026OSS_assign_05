<body>
    <!--

    <button> +</button>
    <input type="text" id="num2" size="5">

<h3> Cilck event</h3>
<button id="Cilck1"> 눌러보세용(alert)</button>
<button id="Cilck2"> 눌러보세용(innerText)</button>
<button id="Cilck3"> 눌러보세용(innerHTML)</button>
<p id="text"></p>




</body>

</html>

<script>
    function changeText() {
        document.getElementById("div1").innerHTML = "<h1>Hello world </h1>";
    }

    function calculate() {
        const num1 = document.querySelector("#num1").value;
        const num2 = document.querySelector("#num2").value;
        const result = Number(num1) + Number(num2);
        document.querySelector("#result").value = result;
    }
    document.getElementById("Cilck1").addEventListener("click", function () {
        alert("하이");
    });
    
</script>
