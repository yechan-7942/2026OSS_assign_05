<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #container {
            width: 200px;
            height: 200px;
            background-color: antiquewhite;
        }

        #Delete{

            background-color: red;
        }
    </style>
</head>

<body>
    <!--
    덧셈 계산기 만들어보기-->
    <input type="text" id="num1" size="5">
    <button> +</button>
    <input type="text" id="num2" size="5">
    <button onclick="calculate()">=</button>
    <input id="result" readonly>

    <p> </p>

    <hr />
    <!--
    <div id="div1" onclick="changeText()">
        Hello
    </div>
-->

    <!--
chilk event 만들어보기
-->

    <h3> Cilck event</h3>
    <button id="Cilck1"> 눌러보세용(alert)</button>
    <button id="Cilck2"> 눌러보세용(innerText)</button>
    <button id="Cilck3"> 눌러보세용(innerHTML)</button>
    <p id="text"></p>

    <hr>


    <!--
동적 요소 추가-->

    <h3> 동적요소 추가</h3>
    <button id="addbtn">동적 요소 추가</button>
    <div id="container"></div>


    <!--
    삭제 추가 -->

    <hr>
    <h3>
        요소 삭제
    </h3>
    <div id="list">
        <p id=item1>포도</p>
        <p id=item2>사과</p>
        <p id=item3>오렌지</p>
    </div>

    <button id="Delete"> 삭제</button>
    <script>
        const item = document.getElementById("item2");
        const button= document.getElementById("Delete");

        button.addEventListener("click",function(){
            item.remove();
        });
    </script>



<!--
10/1 수업

-->
<hr>    

<button id = "btn1"> Click me!!</button>





</body>
</html>

<script>
    function changeText() {
        document.getElementById("div1").innerHTML = "<h1>Hello world </h1>";
    }

    function calculate() {
        const num1 = document.querySelector("#num1").value;
        const num2 = document.querySelector("#num2").value;
        const result = Number(num1) + Number(num2);
        document.querySelector("#result").value = result;
    }
    document.getElementById("Cilck1").addEventListener("click", function () {
        alert("alert 완료");
    });
    document.getElementById("Cilck2").addEventListener("click", function () {
        document.getElementById("text").innerText = "innerText 완료";
    });
    document.getElementById("Cilck3").addEventListener("click", function () {
        document.getElementById("text").innerHTML = "<b>innerHTML 완료</b>";
    });



    const addBtn = document.getElementById("addbtn");
    const container = document.getElementById("container");

    addBtn.addEventListener("click", function () {
        const newDiv = document.createElement("div");
        newDiv.textContent = "요소 추가";
        container.appendChild(newDiv);
    });


    const btn1 = document.querySelector("#btn1");
    btn1.addEventListener("click", function(){
        alert("hello world");
    })

</script>
